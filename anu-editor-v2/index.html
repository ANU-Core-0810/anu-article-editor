<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANU Article Studio</title>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            muted: {
              DEFAULT: 'hsl(var(--muted-bg))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          fontFamily: {
            sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="./app.css">
</head>
<body class="bg-background text-foreground font-sans antialiased">
  <main class="app-shell min-h-screen">
    <aside class="sidebar" aria-label="Article navigation">
      <header class="sidebar__head">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">A</span>
          <div>
            <strong>Article Studio</strong>
            <span>Notion articles</span>
          </div>
        </div>
      </header>

      <label class="search-field">
        <span class="sr-only">Search articles</span>
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="articleSearch" type="search" placeholder="Search title or code">
      </label>

      <div class="status-filter" role="group" aria-label="Filter articles by status">
        <button class="is-active" type="button" data-status-filter="all">All</button>
        <button type="button" data-status-filter="등록 중">등록 중</button>
        <button type="button" data-status-filter="업데이트">업데이트</button>
        <button type="button" data-status-filter="업로드">업로드</button>
      </div>

      <nav class="article-list" aria-label="Articles">
        <button class="article-row is-active" type="button">
          <span>ARTI26-001</span>
          <strong>손의 경험 | 좋은 보울을 만드는 요소</strong>
          <em>등록 중</em>
        </button>
        <button class="article-row" type="button">
          <span>ARTI26-004</span>
          <strong>여름의 식사는 왜 더 단순해질까</strong>
          <em>업데이트</em>
        </button>
      </nav>
    </aside>

    <section class="editor" aria-label="Article editor">
      <header class="topbar">
        <div class="title-fields">
          <div class="title-meta">
            <span id="saveState" class="save-state">Saved</span>
            <span>ANU Article Editor</span>
          </div>
          <input id="englishTitle" class="title-input" value="What Makes a Good Bowl" aria-label="English title">
          <input id="koreanTitle" class="subtitle-input" value="손의 경험 | 좋은 보울을 만드는 요소" aria-label="Korean title">
        </div>

        <div class="topbar__actions">
          <button class="ui-button ui-button--ghost" type="button" id="toggleSidebar" aria-label="Toggle article list">
            <i data-lucide="panel-left" aria-hidden="true"></i>
            <span>Articles</span>
          </button>
          <button class="ui-button ui-button--secondary" type="button" id="loadArticles">
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
            <span>Load Notion</span>
          </button>
          <button class="ui-button ui-button--secondary" type="button" id="toggleExport">
            <i data-lucide="file-down" aria-hidden="true"></i>
            <span>Cafe24</span>
          </button>
          <details class="utility-menu">
            <summary class="ui-button ui-button--ghost" aria-label="More actions">
              <i data-lucide="more-horizontal" aria-hidden="true"></i>
              <span>More</span>
            </summary>
            <div class="utility-menu__content">
              <button type="button" id="saveDraft"><i data-lucide="hard-drive" aria-hidden="true"></i>Save local draft</button>
              <button type="button" id="copyHtml"><i data-lucide="code-2" aria-hidden="true"></i>Copy HTML</button>
              <button type="button" id="copyJson"><i data-lucide="braces" aria-hidden="true"></i>Copy JSON</button>
              <button type="button" id="importJson"><i data-lucide="upload" aria-hidden="true"></i>Import JSON</button>
            </div>
          </details>
          <button class="ui-button ui-button--primary" type="button" data-gas-action="saveEditorData">
            <i data-lucide="database" aria-hidden="true"></i>
            <span>Save to Notion</span>
          </button>
          <input id="importJsonInput" class="sr-only" type="file" accept="application/json,.json">
        </div>
      </header>

      <div class="workarea">
        <section class="composer" aria-label="Composer">
          <div class="composer__floatbar">
            <span>Editing panel</span>
            <button class="ui-button ui-button--ghost" type="button" id="minimizeComposer">
              <i data-lucide="minus" aria-hidden="true"></i>
              Minimize
            </button>
          </div>

          <section class="panel meta-panel">
            <div class="panel__head">
              <div>
                <p class="panel-eyebrow">Article</p>
                <h2>Publishing details</h2>
              </div>
              <button class="ui-button ui-button--ghost" type="button" id="toggleComposerFloat">
                <i data-lucide="panel-right-open" aria-hidden="true"></i>
                Overlay
              </button>
            </div>
            <div class="meta-grid">
              <label class="field">
                <span>Status</span>
                <select id="articleStatus">
                  <option>시작 전</option>
                  <option>작성 중</option>
                  <option selected>등록 중</option>
                  <option>업데이트</option>
                  <option>업로드</option>
                </select>
              </label>
              <label class="field">
                <span>Article code</span>
                <input id="articleCode" value="ARTI26-001">
              </label>
              <button class="ui-button ui-button--secondary field-button" type="button" id="generateArticleCode">
                <i data-lucide="hash" aria-hidden="true"></i>
                Generate
              </button>
              <label class="field">
                <span>Category</span>
                <select id="articleCategory">
                  <option value="life">life</option>
                  <option value="craft" selected>craft</option>
                  <option value="sustainability">sustainability</option>
                  <option value="archive">archive</option>
                </select>
              </label>
              <label class="field">
                <span>Type</span>
                <select id="articleType">
                  <option value="essay">essay</option>
                  <option value="interview">interview</option>
                  <option value="curation">curation</option>
                  <option value="guide" selected>guide</option>
                  <option value="project">project</option>
                </select>
              </label>
              <div class="field">
                <span>Publish date</span>
                <div class="date-control">
                  <button type="button" id="publishPrev" aria-label="Previous day">
                    <i data-lucide="chevron-left" aria-hidden="true"></i>
                  </button>
                  <input id="publishDate" type="date" aria-label="Publish date">
                  <button type="button" id="publishNext" aria-label="Next day">
                    <i data-lucide="chevron-right" aria-hidden="true"></i>
                  </button>
                  <button type="button" id="publishToday">Today</button>
                  <button type="button" id="publishClear" aria-label="Clear publish date">
                    <i data-lucide="x" aria-hidden="true"></i>
                  </button>
                </div>
                <small id="publishDateLabel" class="date-label">No date</small>
              </div>
              <label class="field">
                <span>Cafe24 product no.</span>
                <input id="cafe24ProductNo" inputmode="numeric">
              </label>
              <label class="field">
                <span>Cafe24 product code</span>
                <input id="cafe24ProductCode">
              </label>
              <label class="field">
                <span>Product category IDs</span>
                <input id="productCategoryIds" value="114|117">
              </label>
              <label class="field field--wide">
                <span>Deck</span>
                <textarea id="articleDeck">손의 촉감, 무게감, 곡선이 좋은 보울을 완성하는 방식을 살펴봅니다.</textarea>
              </label>
            </div>
          </section>

          <section class="panel">
            <div class="panel__head">
              <div>
                <p class="panel-eyebrow">Blocks</p>
                <h2>Content structure</h2>
              </div>
            </div>
            <div class="block-tools" aria-label="Add block">
              <div>
                <span>Text</span>
                <button type="button" data-add="text"><i data-lucide="type" aria-hidden="true"></i>Text</button>
                <button type="button" data-add="quote"><i data-lucide="quote" aria-hidden="true"></i>Quote</button>
                <button type="button" data-add="credit"><i data-lucide="badge-info" aria-hidden="true"></i>Credit</button>
              </div>
              <div>
                <span>Media</span>
                <button type="button" data-add="image"><i data-lucide="image" aria-hidden="true"></i>Image</button>
                <button type="button" data-add="duo"><i data-lucide="columns-2" aria-hidden="true"></i>Duo</button>
                <button type="button" data-add="slide"><i data-lucide="gallery-horizontal" aria-hidden="true"></i>Slide</button>
                <button type="button" data-add="video"><i data-lucide="video" aria-hidden="true"></i>Video</button>
              </div>
            </div>
            <div id="blockList" class="block-list" aria-live="polite"></div>
          </section>

          <section class="panel export-panel is-collapsed" id="cafeExportPanel">
            <div class="panel__head">
              <div>
                <p class="panel-eyebrow">Cafe24</p>
                <h2>Export actions</h2>
              </div>
              <div class="panel__actions">
                <span id="gasState" class="panel-state">Ready</span>
                <button class="ui-button ui-button--ghost" type="button" id="closeExport" aria-label="Close Cafe24 export panel">
                  <i data-lucide="x" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            <div class="pipeline-panel">
              <label class="field field--wide">
                <span>GAS Web App URL</span>
                <input id="gasEndpoint" placeholder="Local test URL or blank on Cloudflare Pages">
              </label>
              <label class="field">
                <span>Access token</span>
                <input id="gasToken" placeholder="Optional">
              </label>
              <label class="field field--wide">
                <span>Notion editor page ID</span>
                <input id="editorPageId" placeholder="아티클 편집기 page_id">
              </label>
              <label class="field field--wide">
                <span>Notion article page ID</span>
                <input id="articlePageId" placeholder="아티클 DB page_id">
              </label>
              <div class="pipeline-actions">
                <button class="ui-button ui-button--secondary" type="button" data-gas-action="saveEditorData"><i data-lucide="database" aria-hidden="true"></i>Save to Notion</button>
                <button class="ui-button ui-button--secondary" type="button" data-gas-action="runAll"><i data-lucide="play" aria-hidden="true"></i>Run all</button>
                <button class="ui-button ui-button--secondary" type="button" data-gas-action="exportRegistrationCsv"><i data-lucide="file-plus-2" aria-hidden="true"></i>Registration CSV</button>
                <button class="ui-button ui-button--secondary" type="button" data-gas-action="exportUpdateCsv"><i data-lucide="file-pen-line" aria-hidden="true"></i>Update CSV</button>
              </div>
            </div>
          </section>
        </section>

        <section class="preview" aria-label="Preview">
          <div class="preview__toolbar">
            <div>
              <p class="panel-eyebrow">Preview</p>
              <strong>Rendered article page</strong>
            </div>
            <div class="preview-controls">
              <div class="segmented segmented--preview" role="group" aria-label="Preview size">
                <button class="is-active" type="button" data-width="1440"><i data-lucide="monitor" aria-hidden="true"></i>Desktop</button>
                <button type="button" data-width="834"><i data-lucide="tablet" aria-hidden="true"></i>Tablet</button>
                <button type="button" data-width="390"><i data-lucide="smartphone" aria-hidden="true"></i>Mobile</button>
              </div>
              <label class="viewport-slider">
                <span id="viewportLabel">1440px</span>
                <input id="viewportRange" type="range" min="320" max="1440" value="1440">
              </label>
            </div>
          </div>
          <div class="preview__stage">
            <div id="deviceFrame" class="device-frame">
              <iframe id="previewFrame" src="./preview.html" title="Article preview"></iframe>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
