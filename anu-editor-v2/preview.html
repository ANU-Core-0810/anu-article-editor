<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANU 아티클 미리보기</title>
  <link rel="stylesheet" href="./site-assets/layout.css">
  <link rel="stylesheet" href="./site-assets/style.css">
  <link rel="stylesheet" href="./site-assets/read-new.css">
  <style>
    @font-face {
      font-family: "Pretendard Variable";
      font-weight: 45 920;
      font-style: normal;
      font-display: swap;
      src: url("./site-assets/font/PretendardVariable.woff2") format("woff2-variations");
    }

    @font-face {
      font-family: "AkkuratLLWeb";
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url("./site-assets/font/AkkuratLLWeb-Regular.woff") format("woff");
    }

    @font-face {
      font-family: "AkkuratLLWeb";
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url("./site-assets/font/AkkuratLLWeb-Bold.woff") format("woff");
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #fff;
      color: #1d1d1f;
    }

    body {
      --font-pretendard: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-akkurat: "AkkuratLLWeb", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-family: var(--font-akkurat, "AkkuratLLWeb", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .preview-shell {
      overflow: hidden;
      padding: clamp(88px, 8.5vw, 158px) 0 112px;
    }

    .preview-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(360px, 0.78fr);
      align-items: end;
      gap: clamp(48px, 7vw, 132px);
      width: 100%;
      margin: 0 auto clamp(44px, 4.4vw, 72px);
      padding: 0 clamp(24px, 3.8vw, 68px);
    }

    .preview-kicker {
      margin: 0 0 20px;
      color: #111;
      font-family: var(--font-akkurat, "AkkuratLLWeb", sans-serif);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      text-transform: uppercase;
    }

    .preview-title {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0;
      color: #111;
      font-family: var(--font-akkurat, "AkkuratLLWeb", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: clamp(54px, 5.15vw, 102px);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .preview-title span {
      font-family: var(--font-pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: clamp(18px, 1.16vw, 24px);
      font-weight: 700;
      line-height: 1.48;
      text-transform: none;
    }

    .preview-deck {
      width: 100%;
      margin: 0;
      color: #111;
      font-family: var(--font-pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 15px;
      font-weight: 650;
      line-height: 1.72;
      word-break: keep-all;
    }

    .preview-body {
      width: 100%;
      margin: 0;
    }

    .preview-body > .arti-body {
      margin-inline: auto;
    }

    .preview-image-placeholder {
      display: grid;
      width: 100%;
      min-height: 240px;
      place-items: center;
      background: #f3f4f6;
      color: rgba(29, 29, 31, 0.48);
      font-family: var(--font-pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      line-height: 1.4;
    }

    .preview-body .arti-product-link::after,
    .preview-body .arti-ext-link::after,
    .preview-body .arti-popup-link::after,
    .preview-body .arti-annotation::after {
      width: auto;
      height: auto;
      margin: 0 0 0 0.2em;
      background: transparent;
      color: currentColor;
      font-family: var(--font-akkurat, "AkkuratLLWeb", sans-serif);
      font-size: 0.84em;
      line-height: 1;
      vertical-align: 0.08em;
      -webkit-mask-image: none;
      mask-image: none;
    }

    .preview-body .arti-product-link::after {
      content: "↗";
    }

    .preview-body .arti-ext-link::after {
      content: "↗";
    }

    .preview-body .arti-popup-link::after,
    .preview-body .arti-annotation::after {
      content: "+";
    }

    .title-img-f .preview-image-placeholder,
    .title-img-m .preview-image-placeholder,
    .img-l .preview-image-placeholder {
      min-height: 56vw;
    }

    .img-m-duo .preview-image-placeholder,
    .title-img-duo .preview-image-placeholder {
      aspect-ratio: 1;
      min-height: 0;
    }

    @media (max-width: 767px) {
      .preview-shell {
        padding: 64px 0 84px;
      }

      .preview-hero {
        grid-template-columns: 1fr;
        gap: 24px;
        margin-bottom: 28px;
        padding: 0 22px;
      }

      .preview-kicker {
        display: none;
      }

      .preview-title {
        font-size: clamp(39px, 11vw, 46px);
        line-height: 1.13;
      }

      .preview-title span {
        font-size: 22px;
        line-height: 1.52;
      }

      .preview-deck {
        font-size: 17px;
        line-height: 1.76;
      }

      .preview-image-placeholder {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <section class="preview-hero">
      <div>
        <p id="previewCategory" class="preview-kicker">CRAFT / GUIDE / 2026-07-31</p>
        <h1 id="previewTitle" class="preview-title">What Makes a Good Bowl<span>손의 경험 | 좋은 보울을 만드는 요소</span></h1>
      </div>
      <p id="previewDeck" class="preview-deck">손의 촉감, 무게감, 곡선이 좋은 보울을 완성하는 방식을 살펴봅니다.</p>
    </section>
    <section id="previewBody" class="preview-body">
      <div class="arti-body">
        <div class="arti-block arti-block--narrow">
          <p class="basic-p">손에 닿는 감각은 보울을 고르는 가장 직관적인 기준입니다.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./site-assets/arti-body.js"></script>
  <script>
    const titleEl = document.getElementById('previewTitle');
    const categoryEl = document.getElementById('previewCategory');
    const deckEl = document.getElementById('previewDeck');
    const bodyEl = document.getElementById('previewBody');

    function renderArticle(payload) {
      const meta = payload.meta || {};
      const previousScrollX = window.scrollX;
      const previousScrollY = window.scrollY;
      const englishTitle = meta.englishTitle || '제목 없음';
      const koreanTitle = meta.koreanTitle || '';
      titleEl.innerHTML = escapeHtml(englishTitle) + (koreanTitle ? '<span>' + escapeHtml(koreanTitle) + '</span>' : '');
      categoryEl.textContent = formatMetaLine(meta);
      deckEl.textContent = meta.deck || '';
      bodyEl.innerHTML = payload.html || '<div class="arti-body"></div>';
      bodyEl.querySelectorAll('[data-reveal]').forEach(element => {
        element.classList.add('is-visible');
      });
      installImageFallbacks();
      if (window.ANUArticleBodyInit) window.ANUArticleBodyInit();
      requestAnimationFrame(() => window.scrollTo(previousScrollX, previousScrollY));
    }

    function installImageFallbacks() {
      bodyEl.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => {
          const placeholder = document.createElement('div');
          placeholder.className = 'preview-image-placeholder';
          placeholder.textContent = '이미지 미리보기를 불러올 수 없습니다';
          img.replaceWith(placeholder);
        }, { once: true });
      });
    }

    function formatMetaLine(meta) {
      return [meta.category, meta.type, meta.publishDate]
        .filter(Boolean)
        .map(value => String(value).toUpperCase())
        .join(' / ');
    }

    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'ANU_ARTICLE_PREVIEW_UPDATE') return;
      renderArticle(event.data.payload || {});
    });

    window.parent.postMessage({ type: 'ANU_ARTICLE_PREVIEW_READY' }, '*');

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
