<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANU 아티클 미리보기</title>
  <link rel="stylesheet" href="./site-assets/layout.css">
  <link rel="stylesheet" href="./site-assets/style.css">
  <link rel="stylesheet" href="./site-assets/read-new.css">
  <style>
    @font-face {
      font-family: "Pretendard Variable";
      font-weight: 45 920;
      font-style: normal;
      font-display: swap;
      src: url("./site-assets/font/PretendardVariable.woff2") format("woff2-variations");
    }

    @font-face {
      font-family: "AkkuratLLWeb";
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      src: url("./site-assets/font/AkkuratLLWeb-Regular.woff") format("woff");
    }

    @font-face {
      font-family: "AkkuratLLWeb";
      font-weight: 700;
      font-style: normal;
      font-display: swap;
      src: url("./site-assets/font/AkkuratLLWeb-Bold.woff") format("woff");
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #fff;
      color: #1d1d1f;
    }

    body {
      --font-pretendard: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-akkurat: "AkkuratLLWeb", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-family: var(--font-akkurat, "AkkuratLLWeb", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .preview-shell {
      overflow: hidden;
      padding: 124px 0 124px;
    }

    .preview-hero {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      align-items: start;
      gap: 44px;
      width: 100%;
      margin: 0 auto 48px;
      padding: 0 44px;
    }

    .preview-title-column,
    .preview-copy-column {
      min-width: 0;
      width: 100%;
      justify-self: stretch;
    }

    .preview-title-column {
      grid-column: span 8;
    }

    .preview-copy-column {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      gap: 48px;
      padding-top: 6px;
    }

    .preview-kicker {
      margin: 0;
      color: #111;
      font-family: var(--font-akkurat, "AkkuratLLWeb", sans-serif);
      font-size: 17px;
      font-weight: 500;
      line-height: 26px;
      text-transform: none;
    }

    .preview-title {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin: 0;
      color: #111;
      font-family: var(--font-akkurat, "AkkuratLLWeb", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 78px;
      font-weight: 700;
      line-height: 91px;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .preview-title span {
      font-family: var(--font-akkurat, "AkkuratLLWeb", var(--font-pretendard), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 26px;
      font-weight: 500;
      line-height: 39px;
      text-transform: none;
    }

    .preview-deck {
      width: 100%;
      margin: 0;
      color: #111;
      font-family: var(--font-akkurat, "AkkuratLLWeb", var(--font-pretendard), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 17px;
      font-weight: 500;
      line-height: 26px;
      word-break: keep-all;
    }

    .preview-body {
      width: 100%;
      margin: 0;
    }

    .preview-body > .arti-body {
      margin-inline: auto;
    }

    .preview-image-placeholder {
      display: grid;
      width: 100%;
      min-height: 240px;
      place-items: center;
      background: #f3f4f6;
      color: rgba(29, 29, 31, 0.48);
      font-family: var(--font-pretendard, "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      line-height: 1.4;
    }

    .preview-body .arti-product-link::after,
    .preview-body .arti-ext-link::after,
    .preview-body .arti-popup-link::after,
    .preview-body .arti-annotation::after {
      width: auto;
      height: auto;
      margin: 0 0 0 0.2em;
      background: transparent;
      color: currentColor;
      font-family: var(--font-akkurat, "AkkuratLLWeb", sans-serif);
      font-size: 0.84em;
      line-height: 1;
      vertical-align: 0.08em;
      -webkit-mask-image: none;
      mask-image: none;
    }

    .preview-body .arti-product-link::after {
      content: "↗";
    }

    .preview-body .arti-ext-link::after {
      content: "↗";
    }

    .preview-body .arti-popup-link::after,
    .preview-body .arti-annotation::after {
      content: "+";
    }

    .title-img-f .preview-image-placeholder,
    .title-img-m .preview-image-placeholder,
    .img-l .preview-image-placeholder {
      min-height: 56vw;
    }

    .img-m-duo .preview-image-placeholder,
    .title-img-duo .preview-image-placeholder {
      aspect-ratio: 1;
      min-height: 0;
    }

    @media (max-width: 767px) {
      .preview-shell {
        padding: 44px 0 84px;
      }

      .preview-hero {
        display: flex;
        flex-direction: column;
        gap: 24px;
        margin-bottom: 20px;
        padding: 0 16px;
      }

      .preview-title-column,
      .preview-copy-column {
        flex: none;
        width: 100% !important;
      }

      .preview-copy-column {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        inline-size: 100% !important;
        padding-top: 0;
      }

      .preview-kicker {
        display: none;
      }

      .preview-title {
        font-size: 32px;
        line-height: 37px;
        gap: 8px;
      }

      .preview-title span {
        font-size: 19px;
        font-weight: 500;
        line-height: 32px;
      }

      .preview-deck {
        margin-top: 24px;
        inline-size: 100% !important;
        max-width: none !important;
        font-size: 15px;
        font-weight: 500;
        line-height: 22px;
      }

      .preview-body {
        padding: 0 16px;
      }

      .preview-image-placeholder {
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <section class="preview-hero">
      <div class="preview-title-column">
        <h1 id="previewTitle" class="preview-title">What Makes a Good Bowl<span>손의 경험 | 좋은 보울을 만드는 요소</span></h1>
      </div>
      <div class="preview-copy-column">
        <p id="previewCategory" class="preview-kicker">CRAFT / GUIDE / 2026-07-31</p>
        <p id="previewDeck" class="preview-deck">손의 촉감, 무게감, 곡선이 좋은 보울을 완성하는 방식을 살펴봅니다.</p>
      </div>
    </section>
    <section id="previewBody" class="preview-body">
      <div class="arti-body">
        <div class="arti-block arti-block--narrow">
          <p class="basic-p">손에 닿는 감각은 보울을 고르는 가장 직관적인 기준입니다.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./site-assets/arti-body.js"></script>
  <script>
    const titleEl = document.getElementById('previewTitle');
    const categoryEl = document.getElementById('previewCategory');
    const deckEl = document.getElementById('previewDeck');
    const bodyEl = document.getElementById('previewBody');
    let lastBodyHtml = '';

    function renderArticle(payload) {
      const meta = payload.meta || {};
      const previousScrollX = window.scrollX;
      const previousScrollY = window.scrollY;
      const englishTitle = meta.englishTitle || '제목 없음';
      const koreanTitle = meta.koreanTitle || '';
      titleEl.innerHTML = escapeHtml(englishTitle) + (koreanTitle ? '<span>' + escapeHtml(koreanTitle) + '</span>' : '');
      categoryEl.textContent = formatMetaLine(meta);
      deckEl.textContent = meta.deck || '';
      renderBodyHtml(payload.html || '<div class="arti-body"></div>');
      if (window.ANUArticleBodyInit) window.ANUArticleBodyInit();
      requestAnimationFrame(() => {
        window.scrollTo(previousScrollX, previousScrollY);
        postPreviewHeight();
      });
    }

    function renderBodyHtml(nextHtml) {
      if (nextHtml === lastBodyHtml) {
        postPreviewHeight();
        return;
      }

      const reusableImages = new Map();
      bodyEl.querySelectorAll('img').forEach(img => {
        const key = imageKey(img.getAttribute('src') || img.currentSrc || img.src);
        if (key && !reusableImages.has(key)) reusableImages.set(key, img);
      });

      const template = document.createElement('template');
      template.innerHTML = nextHtml;
      template.content.querySelectorAll('img').forEach(img => {
        const key = imageKey(img.getAttribute('src') || img.src);
        const reusable = reusableImages.get(key);
        if (reusable) {
          reusable.removeAttribute('data-fallback-installed');
          img.replaceWith(reusable);
          reusableImages.delete(key);
        }
      });

      bodyEl.replaceChildren(...template.content.childNodes);
      lastBodyHtml = nextHtml;
      bodyEl.querySelectorAll('[data-reveal]').forEach(element => {
        element.classList.add('is-visible');
      });
      installImageFallbacks();
    }

    function installImageFallbacks() {
      bodyEl.querySelectorAll('img').forEach(img => {
        if (img.dataset.fallbackInstalled === 'true') return;
        img.dataset.fallbackInstalled = 'true';
        if (img.complete) {
          requestAnimationFrame(postPreviewHeight);
        } else {
          img.addEventListener('load', postPreviewHeight, { once: true });
        }
        img.addEventListener('error', () => {
          const placeholder = document.createElement('div');
          placeholder.className = 'preview-image-placeholder';
          placeholder.textContent = '이미지 미리보기를 불러올 수 없습니다';
          img.replaceWith(placeholder);
          postPreviewHeight();
        }, { once: true });
      });
    }

    function formatMetaLine(meta) {
      return [meta.category, meta.type, meta.publishDate]
        .filter(Boolean)
        .map(value => formatMetaValue(value))
        .join(' / ');
    }

    function formatMetaValue(value) {
      const text = String(value || '').trim();
      if (!text) return '';
      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function imageKey(src) {
      const value = String(src || '').trim();
      if (!value) return '';
      try {
        return new URL(value, window.location.href).href;
      } catch (error) {
        return value;
      }
    }

    function postPreviewHeight() {
      const height = Math.max(
        document.body.scrollHeight,
        document.documentElement.scrollHeight,
        document.body.offsetHeight,
        document.documentElement.offsetHeight
      );
      window.parent.postMessage({ type: 'ANU_ARTICLE_PREVIEW_HEIGHT', height }, '*');
    }

    window.addEventListener('message', event => {
      if (!event.data || event.data.type !== 'ANU_ARTICLE_PREVIEW_UPDATE') return;
      renderArticle(event.data.payload || {});
    });

    window.parent.postMessage({ type: 'ANU_ARTICLE_PREVIEW_READY' }, '*');
    window.addEventListener('load', postPreviewHeight);
    window.addEventListener('resize', postPreviewHeight);

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
